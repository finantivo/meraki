<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central Financeira Meraki</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --verde: #466a5e; --oliva: #857a50; --laranja: #c4610f; --areia: #d9bc94; --bg: #f6f2ec; --sup: #fff; --sup2: #f3eee6; --linha: #e6dfd3;
  --tx: #1f2a26; --tx2: #55605a; --tx3: #8a918c; --pos: #1f8466; --neg: #c8600c; --suave: #e6eeea; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.45 Inter, system-ui, sans-serif; }
header { background: linear-gradient(115deg, var(--verde), var(--oliva) 55%, var(--laranja)); color: #fff; }
.topo { max-width: 1500px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; gap: 18px; }
.marca { font-family: Outfit, sans-serif; font-weight: 700; font-size: 24px; line-height: 1; }
.marca span { display: block; font-size: 10px; letter-spacing: .5em; font-weight: 500; margin-top: 3px; }
.topo h1 { font-family: Outfit, sans-serif; font-weight: 500; font-size: 18px; margin: 0; opacity: .95; }
.topo small { margin-left: auto; opacity: .85; font-size: 12px; }
.abas { max-width: 1500px; margin: 0 auto; padding: 0 28px; display: flex; gap: 4px; }
.abas button { background: transparent; border: 0; color: rgba(255,255,255,.8); padding: 9px 16px 11px; border-radius: 10px 10px 0 0; font-weight: 600; }
.abas button.on { background: var(--bg); color: var(--verde); }
.abas button:disabled { opacity: .45; }
main { max-width: 1500px; margin: 0 auto; padding: 20px 28px; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.lista { display: flex; flex-direction: column; gap: 6px; }
.exp { background: var(--sup); border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.exp.on { border-color: var(--verde); box-shadow: inset 3px 0 0 var(--verde); }
.exp b { display: block; } .exp small { color: var(--tx3); font-size: 12px; }
.cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
h2 { font-family: Outfit, sans-serif; font-weight: 600; font-size: 20px; color: var(--verde); margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
h3 { font-family: Outfit, sans-serif; font-weight: 600; font-size: 15px; color: var(--verde); margin: 0 0 8px; }
.campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
label { font-size: 12px; color: var(--tx2); display: flex; flex-direction: column; gap: 4px; }
input, select { font: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--linha); border-radius: 8px; background: #fff; color: var(--tx); }
button { font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--linha); background: #fff; color: var(--tx); cursor: pointer; }
button.pri { background: var(--verde); color: #fff; border-color: var(--verde); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--linha); font-size: 13px; text-align: left; vertical-align: top; }
th { background: var(--sup2); color: var(--tx2); font-size: 12px; font-weight: 600; }
td.v, th.v { text-align: right; white-space: nowrap; }
tr.grupo td { background: var(--sup2); font-weight: 600; color: var(--verde); }
.neg { color: var(--neg); } .muted { color: var(--tx3); font-size: 12px; }
.tag { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: #faeeda; color: #633806; white-space: nowrap; }
.tag.ab { background: var(--suave); color: #2b4a40; }
.resumo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
.kpi { background: var(--sup2); border-radius: 10px; padding: 10px 12px; } .kpi span { font-size: 12px; color: var(--tx2); } .kpi b { display: block; font-size: 20px; font-family: Outfit, sans-serif; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.msg { margin-top: 10px; font-size: 13px; }
details summary { cursor: pointer; color: var(--verde); font-weight: 600; font-size: 14px; }
.vazio { color: var(--tx3); padding: 10px 0; }
</style>
<script src="../comum.js"></script>
<script>if (!sessaoMeraki('notas')) location.replace('./'); ligarGoogleScriptRun('notas');</script>
<link rel="icon" type="image/svg+xml" href="../icone-central.svg">
</head>
<body>
<header><div class="topo"><div class="marca">Meraki<span>DIGITAL</span></div><h1>Central Financeira</h1><small id="atualizado"></small></div>
  <nav class="abas" id="abas"><button data-a="cartoes" class="on">Cartões</button><button data-a="notas">Notas de débito e crédito</button><button disabled>Conferência de vendas</button></nav></header>
<main id="aba-notas" hidden>
  <aside><div class="lista" id="lista"></div></aside>
  <section id="conteudo"><div class="vazio">Carregando…</div></section>
</main>
<script>
// qualquer erro aparece na tela (para a Malu poder mandar o print)
window.addEventListener('error', e => { const d = document.createElement('pre'); d.style.cssText = 'color:#c8600c;background:#fff;padding:10px 16px;margin:0;white-space:pre-wrap;font-size:12px';
  d.textContent = 'Erro: ' + e.message + ' (linha ' + e.lineno + ')'; document.body.insertBefore(d, document.body.firstChild); });
</script>
<script>
const CHAVE = window.CHAVE_NOTAS || (function () { try { return localStorage.getItem('meraki_sessao_notas'); } catch (e) { return null; } })();
let D = null, atual = null, marcados = {};
const brl = v => (v < 0 ? '−' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const dia = d => (d ? String(d).slice(0, 10).split('-').reverse().join('/') : '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const hoje = () => new Date().toISOString().slice(0, 10);
const el = id => document.getElementById(id);
const rodar = (fn, ...args) => new Promise((ok, erro) => google.script.run.withSuccessHandler(ok).withFailureHandler(erro)[fn](CHAVE, ...args));

function carregar() {
  return rodar('dadosNotas').then(d => {
    D = d;
    el('atualizado').textContent = d.atualizado ? 'Conta Azul atualizado em ' + d.atualizado : '';
    if (!atual || !D.experts.some(e => e.nome === atual)) atual = (D.experts.find(e => e.fila.length || e.manuais.length) || D.experts[0] || {}).nome;
    D.experts.forEach(e => e.fila.concat(e.manuais).forEach(i => { if (!(i.key in marcados)) marcados[i.key] = true; }));
    desenhar();
  }).catch(e => { el('conteudo').innerHTML = `<div class="cartao neg">${esc(e.message || e)}</div>`; });
}

function itensDe(e, tipo) {
  return e.fila.filter(i => i.tipo === tipo).concat(e.manuais.filter(m => m.tipo === tipo).map(m => Object.assign({manual: true, comp: m.data}, m)));
}
const somaSel = (e, tipo) => itensDe(e, tipo).filter(i => marcados[i.key]).reduce((s, i) => s + Number(i.parte), 0);

function desenhar() {
  el('lista').innerHTML = D.experts.map(e => {
    const n = e.fila.length + e.manuais.length;
    return `<div class="exp ${e.nome === atual ? 'on' : ''}" data-e="${esc(e.nome)}"><b>${esc(e.nome)}</b><small>${n ? n + ' itens na fila' : 'nada pendente'} · ${esc(e.status)}</small></div>`;
  }).join('') + `<div class="exp ${atual === '#hist' ? 'on' : ''}" data-e="#hist"><b>Notas emitidas</b><small>${D.historico.length} no histórico</small></div>`;
  if (atual === '#hist') return desenharHistorico();
  const e = D.experts.find(x => x.nome === atual);
  if (!e) { el('conteudo').innerHTML = '<div class="vazio">Nenhum expert.</div>'; return; }
  const tabela = (tipo, titulo) => {
    const xs = itensDe(e, tipo);
    if (!xs.length) return `<tr class="grupo"><td colspan="7">${titulo}</td></tr><tr><td colspan="7" class="muted">Nada na fila.</td></tr>`;
    return `<tr class="grupo"><td><input type="checkbox" data-todos="${tipo}" ${xs.every(i => marcados[i.key]) ? 'checked' : ''}></td><td colspan="6">${titulo}</td></tr>` + xs.map(i => `<tr>
      <td><input type="checkbox" data-k="${esc(i.key)}" ${marcados[i.key] ? 'checked' : ''}></td>
      <td>${dia(i.comp)}</td><td>${esc(i.quem || '')}</td>
      <td>${esc(i.desc || '')} ${i.manual ? '<span class="tag">lançado à mão</span> <a href="#" data-rm="' + esc(i.key) + '" class="muted">remover</a>' : (i.aberto ? '<span class="tag">ainda não paga</span>' : '')}</td>
      <td class="muted">${esc(i.cat || '')}</td><td class="v">${brl(Number(i.integral))}</td><td class="v ${i.parte < 0 ? 'neg' : ''}"><b>${brl(Number(i.parte))}</b></td></tr>`).join('');
  };
  const nd = somaSel(e, 'ND'), nc = somaSel(e, 'NC'), saldo = nd - nc;
  const dd = e.dados || {};
  el('conteudo').innerHTML = `
    <div class="cartao"><h2>${esc(e.nome)}</h2>
      <div class="campos">
        <label>Nº da nota de débito<input id="nND" type="number" value="${e.proxND}"></label>
        <label>Nº da nota de crédito<input id="nNC" type="number" value="${e.proxNC}"></label>
        <label>Emissão<input id="emissao" type="date" value="${hoje()}"></label>
        <label>Vencimento<input id="venc" type="date" value="${hoje()}"></label>
        <label>Referência<input id="ref" placeholder="ex.: out/26"></label>
      </div>
      <div class="resumo">
        <div class="kpi"><span>Nota de débito (expert paga)</span><b>${brl(nd)}</b></div>
        <div class="kpi"><span>Nota de crédito (Meraki paga)</span><b>${brl(nc)}</b></div>
        <div class="kpi"><span>${saldo >= 0 ? 'Saldo a receber do expert' : 'Saldo a pagar ao expert'}</span><b style="color:${saldo >= 0 ? 'var(--pos)' : 'var(--neg)'}">${brl(Math.abs(saldo))}</b></div>
      </div>
      <div class="acoes"><button class="pri" id="emitir">Emitir notas e gerar PDFs</button><button id="jaCobrados">Marcar selecionados como já cobrados</button></div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="cartao"><h3>Itens na fila</h3>
      <table><thead><tr><th></th><th>Competência</th><th>Fornecedor / cliente</th><th>Descrição</th><th>Categoria</th><th class="v">Valor integral</th><th class="v">Parte ${esc(e.nome)}</th></tr></thead>
      <tbody id="itens">${tabela('ND', 'Nota de débito · despesas pagas pela Meraki (parte do expert)')}${tabela('NC', 'Nota de crédito · vendas na cota do expert e gastos pagos por ele')}</tbody></table>
    </div>
    <div class="cartao"><details><summary>Incluir item lançado à mão (ex.: prêmio, frete pago pelo expert)</summary>
      <div class="campos" style="margin-top:10px">
        <label>Nota<select id="mTipo"><option value="NC">Crédito (o expert pagou)</option><option value="ND">Débito</option></select></label>
        <label>Data<input id="mData" type="date" value="${hoje()}"></label>
        <label>Fornecedor<input id="mQuem"></label><label>Descrição<input id="mDesc"></label>
        <label>Valor integral<input id="mInt" type="number" step="0.01"></label>
        <label>% que vai na nota<input id="mPct" type="number" step="1" value="60"></label>
      </div><div class="acoes" style="margin-top:10px"><button id="addManual">Incluir na fila</button></div></details></div>
    <div class="cartao"><details><summary>Dados do expert para a nota</summary>
      <div class="campos" style="margin-top:10px">
        <label>Razão social<input id="dRazao" value="${esc(dd.razao || '')}"></label><label>CNPJ / CPF<input id="dCnpj" value="${esc(dd.cnpj || '')}"></label>
        <label>Endereço<input id="dEnd" value="${esc(dd.endereco || '')}"></label><label>Banco, agência e conta<input id="dBanco" value="${esc(dd.banco || '')}"></label>
        <label>Chave Pix<input id="dPix" value="${esc(dd.pix || '')}"></label>
      </div><div class="acoes" style="margin-top:10px"><button id="salvarDados">Salvar dados</button></div></details></div>`;
  ligar(e);
}

function ligar(e) {
  el('itens').onchange = ev => {
    const t = ev.target;
    if (t.dataset.k) marcados[t.dataset.k] = t.checked;
    if (t.dataset.todos) itensDe(e, t.dataset.todos).forEach(i => marcados[i.key] = t.checked);
    desenhar();
  };
  el('itens').onclick = ev => { const a = ev.target.closest('[data-rm]'); if (a) { ev.preventDefault(); rodar('removerManual', a.dataset.rm).then(carregar); } };
  el('emitir').onclick = () => {
    const sel = t => itensDe(e, t).filter(i => marcados[i.key]).map(i => i.key);
    const pedido = {expert: e.nome, itens: {ND: sel('ND'), NC: sel('NC')}, numeros: {ND: el('nND').value, NC: el('nNC').value},
      emissao: el('emissao').value, vencimento: el('venc').value, referencia: el('ref').value};
    if (!pedido.itens.ND.length && !pedido.itens.NC.length) { el('msg').textContent = 'Selecione pelo menos um item.'; return; }
    el('emitir').disabled = true; el('msg').textContent = 'Gerando as notas…';
    rodar('emitirNotas', pedido).then(r => {
      el('msg').innerHTML = 'Pronto: ' + r.map(n => `<a href="${n.pdfUrl}" target="_blank">${n.tipo} ${n.numero} (${brl(n.total)})</a>`).join(' · ');
      return carregar().then(() => { el('msg') && (el('msg').innerHTML = 'Pronto: ' + r.map(n => `<a href="${n.pdfUrl}" target="_blank">${n.tipo} ${n.numero} (${brl(n.total)})</a>`).join(' · ')); });
    }).catch(err => { el('msg').textContent = err.message || err; el('emitir').disabled = false; });
  };
  el('jaCobrados').onclick = () => {
    const keys = e.fila.filter(i => marcados[i.key]).map(i => i.key);
    if (!keys.length) return;
    if (!confirm(`Tirar ${keys.length} itens da fila como já cobrados (sem emitir nota)?`)) return;
    rodar('marcarComoCobrados', keys, 'marcado como já cobrado').then(carregar);
  };
  el('addManual').onclick = () => {
    const integral = Number(el('mInt').value), pct = Number(el('mPct').value) / 100, tipo = el('mTipo').value;
    if (!integral || !el('mDesc').value) { alert('Preencha descrição e valor.'); return; }
    rodar('adicionarManual', {expert: e.nome, tipo, data: el('mData').value, quem: el('mQuem').value, desc: el('mDesc').value, integral, parte: Math.round(integral * pct * 100) / 100}).then(carregar);
  };
  el('salvarDados').onclick = () => rodar('salvarDadosExpert', e.nome, {razao: el('dRazao').value, cnpj: el('dCnpj').value, endereco: el('dEnd').value, banco: el('dBanco').value, pix: el('dPix').value})
    .then(() => { el('salvarDados').textContent = 'Salvo ✓'; carregar(); });
}

function desenharHistorico() {
  const linhas = D.historico.map(n => `<tr><td><b>${n.tipo} ${n.numero}</b></td><td>${esc(n.expert)}</td><td>${dia(n.emissao)}</td><td>${esc(n.referencia || '')}</td>
    <td class="v">${brl(n.total)}</td><td>${n.pdfUrl ? `<a href="${n.pdfUrl}" target="_blank">PDF</a>` : ''}</td>
    <td>${n.cancelada ? '<span class="tag">cancelada</span>' : `<select data-id="${n.id}">${['emitida', 'enviada', 'paga', 'cancelada'].map(s => `<option ${s === n.status ? 'selected' : ''}>${s}</option>`).join('')}</select>`}</td></tr>`).join('');
  el('conteudo').innerHTML = `<div class="cartao"><h2>Notas emitidas</h2>${linhas ? `<table><thead><tr><th>Nota</th><th>Expert</th><th>Emissão</th><th>Referência</th><th class="v">Total</th><th></th><th>Situação</th></tr></thead><tbody id="hist">${linhas}</tbody></table>` : '<div class="vazio">Nenhuma nota emitida pela central ainda.</div>'}</div>`;
  const h = el('hist');
  if (h) h.onchange = ev => {
    const s = ev.target;
    if (s.value === 'cancelada' && !confirm('Cancelar a nota devolve os itens para a fila. Continuar?')) { carregar(); return; }
    rodar('mudarStatusNota', s.dataset.id, s.value).then(carregar);
  };
}

el('lista').onclick = ev => { const x = ev.target.closest('[data-e]'); if (x) { atual = x.dataset.e; desenhar(); } };
// abas da central: Cartões abre primeiro; a de notas carrega na primeira vez que for aberta
let notasCarregadas = false;
function abrirAba(a) {
  document.querySelectorAll('#abas button[data-a]').forEach(b => b.classList.toggle('on', b.dataset.a === a));
  el('aba-notas').hidden = a !== 'notas'; el('aba-cartoes').hidden = a !== 'cartoes';
  if (a === 'notas' && !notasCarregadas) { notasCarregadas = true; carregar(); }
  if (a === 'cartoes' && window.abrirCartoes) window.abrirCartoes();
}
el('abas').onclick = ev => { const b = ev.target.closest('[data-a]'); if (b) abrirAba(b.dataset.a); };
</script>
<style>
#aba-cartoes { max-width: 1500px; margin: 0 auto; padding: 18px 28px 40px; }
.cx-sub { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.cx-sub button { border-radius: 999px; padding: 6px 14px; }
.cx-sub button.on { background: var(--verde); color: #fff; border-color: var(--verde); }
.cx-grade { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; }
@media (max-width: 900px) { .cx-grade { grid-template-columns: 1fr; } }
.cx-cartoes { display: flex; flex-direction: column; gap: 6px; }
.cx-cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.cx-cartao.on { border-color: var(--verde); box-shadow: inset 3px 0 0 var(--verde); }
.cx-cartao b { display: block; } .cx-cartao small { color: var(--tx3); font-size: 12px; display: block; }
.cx-cartao .cx-v { font-family: Outfit, sans-serif; font-size: 16px; color: var(--tx); margin-top: 2px; }
.cx-painel { background: var(--sup); border: 1px solid var(--linha); border-radius: 12px; padding: 16px; margin-bottom: 14px; overflow-x: auto; }
.cx-grade > section { min-width: 0; }
@media (max-width: 700px) { #aba-cartoes { padding: 14px 16px 30px; } .cx-kpis { grid-template-columns: 1fr; } .cx-form { grid-template-columns: 1fr 1fr; } }
.cx-faturas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.cx-faturas button { padding: 5px 11px; font-size: 12px; border-radius: 8px; }
.cx-faturas button.on { border-color: var(--verde); color: var(--verde); font-weight: 600; box-shadow: inset 0 -2px 0 var(--verde); }
.cx-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.cx-kpi { background: var(--sup2); border-radius: 10px; padding: 10px 12px; }
.cx-kpi span { font-size: 12px; color: var(--tx2); } .cx-kpi b { display: block; font-size: 20px; font-family: Outfit, sans-serif; }
.cx-kpi em { font-style: normal; font-size: 12px; }
.ok { color: var(--pos); } .alerta { color: var(--neg); }
.cx-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; align-items: end; }
.cx-form label { min-width: 0; } .cx-form input, .cx-form select { width: 100%; min-width: 0; }
.cx-form .cx-botoes { display: flex; gap: 6px; }
.cx-dica { font-size: 12px; color: var(--tx3); margin-top: 6px; min-height: 16px; }
.cx-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
.cx-acoes .cx-dir { margin-left: auto; }
table.cx-t td, table.cx-t th { padding: 5px 7px; font-size: 12.5px; }
table.cx-t tr:hover td { background: #faf8f4; }
table.cx-t th.c, table.cx-t td.c { text-align: center; white-space: nowrap; }
.cx-lim { height: 5px; background: var(--sup2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.cx-lim i { display: block; height: 100%; background: var(--verde); } .cx-lim i.alto { background: var(--neg); }
.cx-check { justify-content: flex-end; } .cx-check input { width: 18px; height: 18px; margin: 8px 0; }
.cx-filtro { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; }
.cx-filtro select, .cx-filtro input { min-width: 150px; }
.cx-filtro .cx-lk { margin-left: 4px; }
table.cx-t tr.cx-total td { background: var(--sup2); font-weight: 600; border-top: 2px solid var(--linha); }
.cx-st { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.cx-st.v { background: var(--suave); color: #2b4a40; } .cx-st.a { background: #faeeda; color: #633806; } .cx-st.n { background: #f1efe8; color: #5f5e5a; }
.cx-st.r { background: #fbe3d6; color: #8a3b0c; }
.cx-lk { color: var(--verde); cursor: pointer; font-size: 12px; white-space: nowrap; }
