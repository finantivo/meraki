<script>
// Leitura de PDFs no navegador (pdf.js): faturas de cartão Itaú (Empresas e Azul/Itaucard) e relatórios de cobrança do Meta.
// Tudo acontece no computador de quem sobe o arquivo; só o resultado (as linhas) vai para a nuvem.

async function linhasDoPdf(pdfjsLib, dados) {
  const doc = await pdfjsLib.getDocument({data: dados}).promise;
  const out = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const pg = await doc.getPage(p);
    const tc = await pg.getTextContent();
    const its = tc.items.filter(i => i.str && i.str.trim()).map(i => ({s: i.str, x: i.transform[4], y: i.transform[5], w: i.width}));
    // faturas em duas colunas: a coluna da direita começa onde fica o segundo cabeçalho "DATA"
    const xs = its.filter(i => /^DATA(\s|$)/.test(i.s.trim())).map(i => i.x);
    const corte = xs.length && Math.max(...xs) - Math.min(...xs) > 100 ? Math.max(...xs) - 5 : null;
    const blocos = corte ? [its.filter(i => i.x < corte), its.filter(i => i.x >= corte)] : [its];
    blocos.forEach(bl => {
      const grupos = [];
      bl.forEach(i => {
        const g = grupos.find(g => Math.abs(g.y - i.y) < 2.5);
        if (g) g.its.push(i); else grupos.push({y: i.y, its: [i]});
      });
      grupos.sort((a, b) => b.y - a.y);
      grupos.forEach(g => {
        g.its.sort((a, b) => a.x - b.x);
        let t = '', fim = null;
        g.its.forEach(i => { t += (fim !== null && i.x - fim > 1.5 ? ' ' : '') + i.s; fim = i.x + i.w; });
        out.push(t.replace(/\s+/g, ' ').trim());
      });
    });
  }
  return out;
}

const numBR = s => Number(String(s).replace(/R\$\s?/g, '').replace(/\./g, '').replace(',', '.'));
const dataISO = s => { const [d, m, a] = s.split('/'); return a + '-' + m + '-' + d; };

// data da compra (dd/mm) → ano certo, olhando o vencimento da fatura (compras parceladas podem ser de muitos meses antes)
function anoDaCompra(ddmm, venc) {
  const [d, m] = ddmm.split('/').map(Number), [va, vm] = venc.split('-').map(Number);
  const ano = m > vm ? va - 1 : va;
  return ano + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}

function parcelaDe(desc) {
  const m = desc.match(/(\d{2})\/(\d{2})\s*$/);
  return m && Number(m[2]) > 1 && Number(m[1]) <= Number(m[2]) ? Number(m[1]) + '/' + Number(m[2]) : '';
}

function lerFatura(linhas) {
  const txt = linhas.join('\n');
  const r = {tipo: null, venc: null, total: null, final: null, itens: []};
  let m;
  if (/ITAU EMPRESAS/i.test(txt)) {
    r.tipo = 'Itaú Empresas';
    const i = linhas.findIndex(l => /vencimento:/i.test(l));
    if (i >= 0 && (m = linhas[i + 1].match(/(\d{2}\/\d{2}\/\d{4})/))) r.venc = dataISO(m[1]);
    if ((m = txt.match(/Total da fatura R\$\s?([\d.]+,\d{2})/))) r.total = numBR(m[1]);
    if ((m = txt.match(/X{4}\.X{4}\.(\d{4})/))) r.final = m[1];
    let ativo = false, portador = '', secao = '';
    linhas.forEach(l => {
      if (l === 'Lançamentos') { ativo = true; return; }
      if (!ativo) return;
      if (/^Encargos desta fatura/.test(l)) { ativo = false; return; }
      if ((m = l.match(/FINAL (\d{4})$/))) { portador = m[1]; return; }
      if (/^Lançamentos internacionais/.test(l)) secao = 'internacional';
      else if (/^Lançamentos nacionais/.test(l)) secao = 'nacional';
      else if (/^Produtos, serviços/.test(l)) secao = 'produtos';
      if ((m = l.match(/^(\d{2}\/\d{2}) (.+?) (-?R\$\s?-?[\d.]+,\d{2})$/))) {
        let desc = m[2];
        if (secao === 'internacional') desc = desc.replace(/\s+(BRL|USD|EUR)[\d.,]+.*$/, '');
        r.itens.push({data: m[1], desc: desc.trim(), valor: numBR(m[3].replace('-R$', 'R$-')), cartao: portador, secao});
      } else if ((m = l.match(/^Repasse de IOF R\$\s?([\d.]+,\d{2})$/)) && numBR(m[1])) {
        const ult = r.itens[r.itens.length - 1];
        r.itens.push({data: ult ? ult.data : '', desc: 'Repasse de IOF', valor: numBR(m[1]), cartao: portador, secao: 'internacional'});
      }
    });
  } else if (/Lançamentos: compras e saques/.test(txt)) {
    r.tipo = 'Itaucard';
    if ((m = txt.match(/Vencimento:\s*(\d{2}\/\d{2}\/\d{4})/))) r.venc = dataISO(m[1]);
    if ((m = txt.match(/Total desta fatura\s*([\d.]+,\d{2})/))) r.total = numBR(m[1]);
    if ((m = txt.match(/Cartão \d{4}\.X{4}\.X{4}\.(\d{4})/))) r.final = m[1];
    if ((m = txt.match(/Limite total de crédito\s+([\d.]+,\d{2})/))) r.limite = numBR(m[1]);
    let secao = '', portador = '', ultData = '';
    linhas.forEach((l, i) => {
      if (/^Pagamentos efetuados/.test(l)) { secao = 'pagamentos'; return; }
      if (/^Lançamentos: compras e saques/.test(l)) { secao = 'nacional'; return; }
      if (/^Lançamentos internacionais/.test(l)) { secao = 'internacional'; return; }
      if (/^Lançamentos: produtos e serviços/.test(l)) { secao = 'produtos'; return; }
      if (/^(Total dos lançamentos atuais|Compras parceladas - próximas faturas|Limites de crédito)/.test(l)) { secao = ''; return; }
      if (!secao || secao === 'pagamentos') return;
      if (/^DATA /.test(l) && i > 0 && /^[A-ZÁÉÍÓÚÂÊÔÃÕÇ ]{6,}$/.test(linhas[i - 1])) portador = linhas[i - 1];
      // (às vezes sobra um caractere solto do layout depois do valor, como "." ou "L")
      if ((m = l.match(/^(\d{2}\/\d{2}) (.+?) (-?[\d.]+,\d{2})(?: \S)?$/))) {
        ultData = m[1];
        r.itens.push({data: m[1], desc: m[2].trim(), valor: numBR(m[3]), cartao: portador, secao});
      } else if ((m = l.match(/^Repasse de IOF em R\$\s*([\d.]+,\d{2})$/)) && numBR(m[1])) {
        r.itens.push({data: ultData, desc: 'Repasse de IOF', valor: numBR(m[1]), cartao: portador, secao: 'internacional'});
      }
    });
  } else return null;
  r.itens.forEach(it => { it.parcela = parcelaDe(it.desc); if (r.venc && it.data) it.data = anoDaCompra(it.data, r.venc); it.valor = Math.round(it.valor * 100) / 100; });
  r.soma = Math.round(r.itens.reduce((s, i) => s + i.valor, 0) * 100) / 100;
  return r;
}

// relatório de cobrança do Meta (Facebook): cada cobrança com data, final do cartão e valor, e o negócio (expert)
function lerRelatorioMeta(linhas) {
  const txt = linhas.join('\n');
  if (!/Pagamento de Anúncios da Meta|Relatório de cobrança/.test(txt)) return null;
  let m;
  const r = {negocio: (m = txt.match(/Negócio:\s*(.+)/)) ? m[1].trim() : '', conta: (m = txt.match(/Conta:\s*(\d+)/)) ? m[1] : '',
    periodo: (m = txt.match(/Relatório de cobrança:\s*(\S+ a \S+)/)) ? m[1] : '', cobrancas: []};
  linhas.forEach(l => {
    if ((m = l.match(/(\d{2}\/\d{2}\/\d{4}).*?(\d{4})\s+R\$\s?([\d.]+,\d{2})\s+\w+\s+(\w+)/))) {
      r.cobrancas.push({data: dataISO(m[1]), final: m[2], valor: numBR(m[3]), status: m[4]});
    }
  });
  if ((m = txt.match(/Valor total cobrado\s+R\$\s?([\d.]+,\d{2})/))) r.total = numBR(m[1]);
  r.soma = Math.round(r.cobrancas.filter(c => c.status === 'Pago').reduce((s, c) => s + c.valor, 0) * 100) / 100;
  return r;
}

if (typeof module !== 'undefined') module.exports = {linhasDoPdf, lerFatura, lerRelatorioMeta};

</script>

<script>
(function () {
  // leitor de PDF (pdf.js) só é carregado quando alguém vai importar um arquivo
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  function carregarPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return new Promise((ok, falha) => {
      const sc = document.createElement('script');
      if (window.__NONCE) sc.nonce = window.__NONCE;
      sc.src = PDFJS + 'pdf.min.js';
      sc.onload = () => { if (!window.pdfjsLib) return falha(new Error('Leitor de PDF não carregou.')); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
      sc.onerror = () => falha(new Error('Leitor de PDF não carregou (sem internet?).'));
      setTimeout(() => falha(new Error('Leitor de PDF demorou demais para carregar.')), 20000);
      document.head.appendChild(sc);
    });
  }
  let C = null, vista = 'faturas', cartaoSel = null, vencSel = null, editando = null, prefill = null;
  const r2 = v => Math.round(v * 100) / 100;
  const v2 = v => Math.abs(v) < 0.005;
  const mesAno = iso => { const [a, m] = iso.split('-'); return ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][Number(m) - 1] + '/' + a.slice(2); };
  const dias = (a, b) => Math.abs((new Date(a) - new Date(b)) / 864e5);
  const semAc = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  window.abrirCartoes = function () { if (!C) carregarCartoes(); };

  function carregarCartoes() {
    return rodar('dadosCartoes').then(d => {
      C = d;
      if (!cartaoSel || !C.base.cartoes.some(c => c.id === cartaoSel)) cartaoSel = (C.base.cartoes.find(c => c.ativo) || {}).id;
      desenharCartoes();
    }).catch(e => { el('cxCorpo').innerHTML = `<div class="cx-painel neg">${esc(e.message || e)}</div>`; });
  }

  // ---------- regras de negócio (as mesmas da nuvem) ----------
  const cartao = id => C.base.cartoes.find(c => c.id === id) || {};
  const projeto = n => C.base.projetos.find(p => p.nome === n);

  function vencDe(cid, dataISO) {
    const c = cartao(cid);
    if (!c.fech || !dataISO) return '';
    let [a, m, d] = dataISO.split('-').map(Number);
    if (d >= c.fech) { m++; if (m > 12) { m = 1; a++; } }       // comprou no dia do fechamento ou depois: próxima fatura
    if (c.venc < c.fech) { m++; if (m > 12) { m = 1; a++; } }    // vencimento cai no mês seguinte ao fechamento
    return a + '-' + String(m).padStart(2, '0') + '-' + String(c.venc).padStart(2, '0');
  }

  function rotuloCentro(centro) {
    const [t, a, b] = String(centro || 'M').split('|');
    if (t === 'M') return 'Meraki';
    if (t === 'R') return 'Rateio · ' + a.split(',').join(', ');
    const p = projeto(a) || {parte: 50};
    return a + ' · ' + (b === 'm' ? 'só Meraki' : b === 'e' ? 'só expert' : p.parte + '/' + (100 - p.parte));
  }

  function dividir(centro, valor) {
    const partes = [], [t, a, b] = String(centro || 'M').split('|');
    const por = (n, modo, v) => {
      const p = projeto(n) || {nome: n, parte: 50};
      if (modo === 'm') partes.push([n, 'meraki', v]); else if (modo === 'e') partes.push([n, 'expert', v]);
      else { const vm = Math.round(v * p.parte) / 100; partes.push([n, 'meraki', vm], [n, 'expert', r2(v - vm)]); }
    };
    if (t === 'M') partes.push(['Meraki', 'meraki', valor]);
    else if (t === 'P') por(a, b || 'd', valor);
    else { const ns = a.split(','), cota = Math.floor(valor * 100 / ns.length) / 100; ns.forEach((n, i) => por(n, 'd', i === ns.length - 1 ? r2(valor - cota * (ns.length - 1)) : cota)); }
    return partes;
  }

  // fatura seguinte do mesmo cartão (mesmo dia de vencimento, um mês depois)
  function proximaFatura(venc) {
    const [a, m, d] = venc.split('-').map(Number), t = a * 12 + m;
    return Math.floor(t / 12) + '-' + String(t % 12 + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }
  const assinaturaAtiva = id => (C.base.assinaturas || []).some(a => a.id === id && a.ativo);
  // fornecedor que vai agrupado para o Conta Azul (padrão: Facebook; muda em Configurar)
  const agrupa = f => { const r = C.base.regras[f] || {}; return r.agrupar !== undefined ? !!r.agrupar : semAc(f) === 'facebook'; };
  // IOF de compra do Facebook vai junto no lançamento do Facebook (como a Lu fazia no Conta Azul)
  const fornGrupo = l => semAc(l.fornecedor) === 'iof' && /facebook|facebk|meta/.test(semAc(l.descricao)) ? 'Facebook' : l.fornecedor;
  const tipoAgrupado = desc => /\bapi\b/.test(semAc(desc)) ? 'api' : 'geral';

  // centros de custo de um lançamento do Conta Azul → projeto da central
  function centroDoCA(partes) {
    const ps = new Set(), lados = {};
    (partes || []).forEach(([, cc]) => {
      const p = C.base.projetos.find(p => p.meraki === cc || p.expert === cc);
      if (!p) return;
      ps.add(p.nome); lados[p.nome] = (lados[p.nome] || '') + (p.meraki === cc ? 'm' : 'e');
    });
    if (!ps.size) return 'M';
    if (ps.size > 1) return 'R|' + [...ps].join(',');
    const n = [...ps][0], l = lados[n];
    return 'P|' + n + '|' + (l.includes('m') && l.includes('e') ? 'd' : l);
  }

  // chave do texto da fatura: 'FACEBK *C6Q9BA6JT4' → 'FACEBK' (ignora códigos com número)
  const chaveFatura = desc => semAc(desc).toUpperCase().split(/[\s*\-_/.]+/).filter(t => t.length >= 3 && !/\d/.test(t)).slice(0, 2).join(' ');

  // casa duas listas pelo valor: 1 para 1, depois um item = soma de vários (agrupados), depois itens que se anulam
  function casar(A, B, janela) {
    const usA = new Set(), usB = new Set(), pares = [];
    const cand = [];
    // parcelas: a data é a da compra original (e às vezes digitada com o ano trocado), então vale só o valor
    A.forEach((a, i) => B.forEach((b, j) => { if (v2(a.valor - b.valor) && (dias(a.data, b.data) <= 45 || a.parcela || b.parcela)) cand.push([dias(a.data, b.data) + (a.parcela && a.parcela === b.parcela ? -1e4 : 0), i, j]); }));
    cand.sort((x, y) => x[0] - y[0]).forEach(([, i, j]) => { if (!usA.has(i) && !usB.has(j)) { usA.add(i); usB.add(j); pares.push([[i], [j]]); } });
    const grupo = (X, usX, Y, usY, inverter) => X.forEach((x, i) => {
      if (usX.has(i)) return;
      const ys = Y.map((y, j) => j).filter(j => !usY.has(j) && dias(X[i].data, Y[j].data) <= janela);
      const achar = (ini, falta, esc, n) => {
        if (esc.length >= 2 && v2(falta)) return esc;
        if (n === 0) return null;
        for (let k = ini; k < ys.length; k++) { const r = achar(k + 1, r2(falta - Y[ys[k]].valor), esc.concat(ys[k]), n - 1); if (r) return r; }
        return null;
      };
      if (ys.length > 40) return;
      const r = achar(0, x.valor, [], 4);
      if (r) { usX.add(i); r.forEach(j => usY.add(j)); pares.push(inverter ? [r, [i]] : [[i], r]); }
    });
    grupo(A, usA, B, usB, false);
    grupo(B, usB, A, usA, true);
    // itens da lista B que se anulam entre si (ex.: anuidade e o estorno dela)
    const anulados = [];
    const rb = () => B.map((b, j) => j).filter(j => !usB.has(j));
    rb().forEach(j => { if (usB.has(j)) return; const k = rb().find(k => k !== j && v2(B[j].valor + B[k].valor)); if (k !== undefined) { usB.add(j); usB.add(k); anulados.push(j, k); } });
    const r3 = rb();  // de três em três (ex.: mensalidade 105,00 e dois descontos de 52,50)
    for (let x = 0; x < r3.length; x++) for (let y = x + 1; y < r3.length; y++) for (let z = y + 1; z < r3.length; z++) {
      const t = [r3[x], r3[y], r3[z]];
      if (t.some(j => usB.has(j))) continue;
      if (v2(B[t[0]].valor + B[t[1]].valor + B[t[2]].valor)) { t.forEach(j => usB.add(j)); anulados.push(...t); }
    }
    return {pares, sobraA: A.map((a, i) => i).filter(i => !usA.has(i)), sobraB: B.map((b, j) => j).filter(j => !usB.has(j)), anulados};
  }

  // monta a visão de uma fatura: lançamentos da central x PDF x Conta Azul
  function situacao(cid, venc) {
    const L = C.base.lancamentos.filter(l => l.cartao === cid && l.venc === venc).sort((a, b) => a.data.localeCompare(b.data));
    const F = (C.base.faturas[cid + '|' + venc] || {});
    const itensF = F.itens || [];
    const CA = C.ca.filter(x => x.cartao === cid && x.venc === venc).map(x => Object.assign({data: x.comp}, x));
    const est = {};
    L.forEach(l => est[l.id] = {fatura: null, ca: null});
    const mf = casar(L, itensF, 31);
    mf.pares.forEach(([ia, ib]) => ia.forEach(i => est[L[i].id].fatura = ib.map(j => itensF[j])));
    // Conta Azul: primeiro pelo que a central mesmo enviou, depois pelo valor
    let Lr = L.filter(l => !(l.caParcela && CA.some(x => x.id === l.caParcela)));
    let CAr = CA.filter(x => !L.some(l => l.caParcela === x.id));
    // ligado a um lançamento do Conta Azul: se o valor mudou na central, o envio corrige o valor lá
    // (vários lançamentos da central podem apontar para o mesmo do Conta Azul, quando lá está agrupado)
    const porParcela = {};
    L.forEach(l => { if (l.caParcela && CA.some(x => x.id === l.caParcela)) (porParcela[l.caParcela] = porParcela[l.caParcela] || []).push(l); });
    Object.keys(porParcela).forEach(id => {
      const x = CA.find(x => x.id === id), ls = porParcela[id], soma = r2(ls.reduce((s, l) => s + l.valor, 0));
      ls.forEach(l => est[l.id].ca = v2(x.valor - soma) ? 'enviado' : ls.length > 1 ? {ajustarGrupo: x, soma, ids: ls.map(l => l.id)} : {ajustar: x});
    });
    // fornecedores que vão agrupados para o Conta Azul (Facebook): um lançamento por projeto, tipo (tráfego/API) e mês da compra,
    // como a Lu já fazia; a central guarda cada cobrança (é o que confere com a fatura) e junta só no envio
    const kG = (forn, centro, desc, data) => semAc(forn) + '|' + projetoDoCentro(centro) + '|' + tipoAgrupado(desc) + '|' + String(data || '').slice(0, 7);
    // já lançado? confere a soma em camadas: projeto+tipo+mês, depois projeto+mês, depois só projeto
    // (na planilha antiga nem sempre "API" e "Tráfego Pago" estavam separados)
    const niveis = [kG, (f, c, d, dt) => kG(f, c, '', dt), (f, c) => kG(f, c, '', '')];
    niveis.forEach(nk => {
      const g2 = {};
      Lr.filter(l => agrupa(fornGrupo(l)) && !est[l.id].ca).forEach(l => { const k = nk(fornGrupo(l), l.centro, l.descricao, l.data); (g2[k] = g2[k] || {L: [], C: []}).L.push(l); });
      CAr.filter(x => agrupa(x.quem)).forEach(x => { const k = nk(x.quem, centroDoCA(x.partes), x.desc, x.comp); if (g2[k]) g2[k].C.push(x); });
      Object.values(g2).forEach(g => {
        if (!g.C.length || !v2(g.L.reduce((s, l) => s + l.valor, 0) - g.C.reduce((s, x) => s + x.valor, 0))) return;
        g.L.forEach(l => est[l.id].ca = g.C);
        CAr = CAr.filter(x => !g.C.includes(x));
      });
    });
    const gs = {};
    Lr.filter(l => agrupa(fornGrupo(l)) && !est[l.id].ca).forEach(l => { const k = kG(fornGrupo(l), l.centro, l.descricao, l.data); (gs[k] = gs[k] || {L: [], C: []}).L.push(l); });
    CAr.filter(x => agrupa(x.quem)).forEach(x => { const k = kG(x.quem, centroDoCA(x.partes), x.desc, x.comp); if (gs[k]) gs[k].C.push(x); });
    Object.values(gs).forEach(g => {
      const soma = r2(g.L.reduce((s, l) => s + l.valor, 0)), somaC = r2(g.C.reduce((s, x) => s + x.valor, 0));
      if (g.C.length && v2(soma - somaC)) g.L.forEach(l => est[l.id].ca = g.C);
      else if (g.C.length === 1) g.L.forEach(l => est[l.id].ca = {ajustarGrupo: g.C[0], soma, ids: g.L.map(l => l.id)});
      else if (g.C.length > 1) g.L.forEach(l => est[l.id].ca = {conflito: g.C});
      else g.L.forEach(l => est[l.id].grupo = g.L.map(l => l.id));
      CAr = CAr.filter(x => !g.C.includes(x));
    });
    // grupo novo, mas o Conta Azul ainda tem lançamentos desse fornecedor e projeto em outro formato: conferir antes
    L.filter(l => est[l.id].grupo).forEach(l => {
      const cs = CAr.filter(x => semAc(x.quem) === semAc(fornGrupo(l)) && projetoDoCentro(centroDoCA(x.partes)) === projetoDoCentro(l.centro));
      if (cs.length) { est[l.id].ca = {conflito: cs}; delete est[l.id].grupo; }
    });
    Lr = Lr.filter(l => !agrupa(fornGrupo(l)));
    const mc = casar(Lr, CAr, 31);
    mc.pares.forEach(([ia, ib]) => ia.forEach(i => est[Lr[i].id].ca = ib.map(j => CAr[j])));
    // o que sobrou dos dois lados soma o mesmo valor: foi lançado no Conta Azul agrupado de outro jeito (não reenviar)
    const sobraL = mc.sobraA.map(i => Lr[i]), sobraC = mc.sobraB.map(j => CAr[j]);
    if (sobraL.length && sobraC.length && v2(sobraL.reduce((s, l) => s + l.valor, 0) - sobraC.reduce((s, x) => s + x.valor, 0))) {
      sobraL.forEach(l => est[l.id].ca = sobraC);
      mc.sobraB = [];
    }
    // lançado agrupado no Conta Azul (ex.: várias cobranças do Facebook de um expert numa linha só):
    // soma por fornecedor + projeto dos dois lados; se bater, está tudo lançado
    const chaveFP = (forn, centro) => semAc(forn) + '|' + projetoDoCentro(centro);
    const grupos = {};
    Lr.filter(l => !est[l.id].ca).forEach(l => { const g = grupos[chaveFP(l.fornecedor, l.centro)] = grupos[chaveFP(l.fornecedor, l.centro)] || {L: [], C: []}; g.L.push(l); });
    mc.sobraB.forEach(j => { const x = CAr[j], g = grupos[chaveFP(x.quem, centroDoCA(x.partes))]; if (g) g.C.push(j); });
    Object.values(grupos).forEach(g => {
      if (!g.C.length || !v2(g.L.reduce((s, l) => s + l.valor, 0) - g.C.reduce((s, j) => s + CAr[j].valor, 0))) return;
      g.L.forEach(l => est[l.id].ca = g.C.map(j => CAr[j]));
      mc.sobraB = mc.sobraB.filter(j => !g.C.includes(j));
    });
    // previsão no Conta Azul (recorrência) com outro valor: o envio corrige a previsão em vez de criar outro lançamento
    //  - mesma quantidade dos dois lados: corrige um a um, pela ordem de data
    //  - um no Conta Azul e vários na central (Facebook agrupado por expert): corrige o total para a soma da fatura
    //  - qualquer outra combinação: não envia; fica "conferir no Conta Azul"
    const pend = () => Lr.filter(l => !est[l.id].ca);
    const casarPrevisoes = chave => {
      const g = {};
      pend().forEach(l => { const k = chave(l.fornecedor, l.centro); (g[k] = g[k] || {L: [], C: []}).L.push(l); });
      mc.sobraB.forEach(j => { const x = CAr[j], k = chave(x.quem, centroDoCA(x.partes)); if (g[k]) g[k].C.push(j); });
      Object.values(g).forEach(({L: ls, C: cs}) => {
        if (!cs.length) return;
        if (cs.length === ls.length) {
          const lo = ls.slice().sort((a, b) => a.data.localeCompare(b.data)), co = cs.slice().sort((a, b) => String(CAr[a].comp).localeCompare(String(CAr[b].comp)));
          lo.forEach((l, i) => est[l.id].ca = {ajustar: CAr[co[i]]});
        } else if (cs.length === 1) {
          const x = CAr[cs[0]], soma = r2(ls.reduce((s, l) => s + l.valor, 0));
          ls.forEach(l => est[l.id].ca = {ajustarGrupo: x, soma, ids: ls.map(l => l.id)});
        } else return;
        mc.sobraB = mc.sobraB.filter(j => !cs.includes(j));
      });
    };
    casarPrevisoes(chaveFP);
    casarPrevisoes(forn => semAc(forn));
    // (só trava com lançamento do mesmo fornecedor e do mesmo projeto; Meraki/rateio valem para qualquer projeto)
    const mesmoProjeto = (a, b) => a === b || ['Meraki', 'Rateio'].includes(a) || ['Meraki', 'Rateio'].includes(b);
    pend().forEach(l => {
      const cs = mc.sobraB.filter(j => semAc(CAr[j].quem) === semAc(l.fornecedor) && mesmoProjeto(projetoDoCentro(l.centro), projetoDoCentro(centroDoCA(CAr[j].partes))));
      if (cs.length) est[l.id].ca = {conflito: cs.map(j => CAr[j])};
    });
    L.forEach(l => { if (l.caId && !est[l.id].ca) est[l.id].ca = 'enviado'; });
    const meta = sugestoesMeta(cid);
    const sugestoes = mf.sobraB.map(j => sugestao(itensF[j], cid, venc, meta));
    L.forEach(l => {
      if (est[l.id].fatura) return;
      const s = sugestoes.find(s => !s.usado && s.fornecedor && semAc(s.fornecedor) === semAc(l.fornecedor) && dias(s.data, l.data) <= 45);
      if (s) { s.usado = true; est[l.id].sugere = s.item; }
    });
    const soFatura = sugestoes.filter(s => !s.usado);
    return {L, F, itensF, CA, est, soFatura, anulados: mf.anulados.map(j => itensF[j]), caSobra: mc.sobraB.map(j => CAr[j]),
      totL: r2(L.reduce((s, l) => s + l.valor, 0)), totCA: r2(CA.reduce((s, x) => s + x.valor, 0))};
  }

  function sugestoesMeta(cid) {
    const c = cartao(cid), out = [];
    Object.values(C.base.meta || {}).forEach(r => {
      const p = r.projeto || (C.base.projetos.find(p => (p.meta || []).includes(r.negocio)) || {}).nome;
      r.cobrancas.forEach(x => { if (x.status === 'Pago' && (c.finais || []).includes(x.final)) out.push(Object.assign({projeto: p}, x)); });
    });
    return out;
  }

  function sugestao(it, cid, venc, meta) {
    const k = chaveFatura(it.desc);
    let fornecedor = C.base.padroes[k] || (/^(FACEBK|METAPAY)/.test(k) ? 'Facebook' : '');
    if (/^IOF|REPASSE IOF/.test(k)) fornecedor = 'IOF';
    const regra = C.base.regras[fornecedor] || {};
    let centro = fornecedor === 'Facebook' ? '' : (regra.centro || '');
    const m = fornecedor === 'Facebook' && meta.find(x => v2(x.valor - it.valor) && dias(x.data, it.data) <= 1);
    if (m && m.projeto) centro = 'P|' + m.projeto + '|d';
    const descBase = fornecedor === 'Facebook' && /^METAPAY/.test(k) ? 'Facebook - API' : (regra.descricao || '');
    const s = {item: it, chave: k, cartao: cid, venc, data: it.data, valor: it.valor, fornecedor, categoria: regra.categoria || '',
      descricao: descBase + (it.parcela && descBase ? ' - ' + it.parcela : ''), parcela: it.parcela || '', centro, metaProj: m && m.projeto};
    s.pronta = !!(s.fornecedor && s.categoria && s.centro && s.valor > 0);
    return s;
  }

  // ---------- telas ----------
  function desenharCartoes() {
    document.querySelectorAll('#cxSub button').forEach(b => b.classList.toggle('on', b.dataset.v === vista));
    if (vista === 'projetos') return telaProjetos();
    if (vista === 'config') return telaConfig();
    telaFaturas();
  }

  function faturasDoCartao(cid) {
    const s = new Set();
    C.base.lancamentos.forEach(l => l.cartao === cid && s.add(l.venc));
    Object.values(C.base.faturas).forEach(f => f.cartao === cid && s.add(f.venc));
    C.ca.forEach(x => x.cartao === cid && s.add(x.venc));
    const aberta = vencDe(cid, hoje());
    if (aberta) s.add(aberta);
    // parcelas futuras já lançadas no Conta Azul não entram na lista (até a fatura seguinte à aberta)
    const limite = aberta ? vencDe(cid, aberta) : '9999';
    return {lista: [...s].filter(v => v && v <= limite).sort().reverse().slice(0, 8), aberta};
  }

  function telaFaturas() {
    const ativos = C.base.cartoes.filter(c => c.ativo);
    const {lista, aberta} = faturasDoCartao(cartaoSel);
    if (!vencSel || !lista.includes(vencSel)) vencSel = aberta;
    const S = situacao(cartaoSel, vencSel), c = cartao(cartaoSel);
    const enviaveis = S.L.filter(l => { const c = S.est[l.id].ca; return S.est[l.id].fatura && (!c || c.ajustar || c.ajustarGrupo) && l.valor > 0; });
    const prontas = S.soFatura.filter(s => s.pronta);
    const naoVieram = S.F.total != null ? S.L.filter(l => !S.est[l.id].fatura && !S.est[l.id].sugere && !l.caId) : [];
    const kpiFat = S.F.total != null ? brl(S.F.total) : '—';
    const difF = S.F.total != null ? r2(S.totL - S.F.total) : null, difC = r2(S.totCA - S.totL);
    el('cxCorpo').innerHTML = `<div class="cx-grade">
      <aside class="cx-cartoes">${ativos.map(x => {
        const ab = vencDe(x.id, hoje()), tot = r2(C.base.lancamentos.filter(l => l.cartao === x.id && l.venc === ab).reduce((s, l) => s + l.valor, 0));
        // limite: tudo o que ainda vai vencer (fatura aberta, próximas e parcelas futuras) ocupa o limite
        const usado = r2(C.base.lancamentos.filter(l => l.cartao === x.id && l.venc >= ab).reduce((s, l) => s + l.valor, 0));
        const pct = x.limite ? Math.min(100, Math.round(usado / x.limite * 100)) : null;
        return `<div class="cx-cartao ${x.id === cartaoSel ? 'on' : ''}" data-c="${x.id}"><b>${esc(x.nome)}</b><small>fecha dia ${x.fech} · vence dia ${x.venc}</small>
          <div class="cx-v">${brl(tot)}</div><small>fatura de ${ab ? dia(ab).slice(0, 5) : '—'}${x.conta ? '' : ' · <span class="alerta">sem conta no Conta Azul</span>'}</small>
          ${pct !== null ? `<div class="cx-lim" title="Limite ${brl(x.limite)} · em uso ${brl(usado)} · livre ${brl(r2(x.limite - usado))}"><i style="width:${pct}%" class="${pct >= 80 ? 'alto' : ''}"></i></div>
          <small class="${pct >= 80 ? 'alerta' : ''}">limite ${pct}% usado · livre ${brl(r2(x.limite - usado))}</small>` : ''}</div>`;
      }).join('')}</aside>
      <section>
        <div class="cx-painel">
          <div class="cx-faturas">${lista.map(v => `<button data-f="${v}" class="${v === vencSel ? 'on' : ''}">${mesAno(v)} · ${dia(v).slice(0, 5)}${v === aberta ? ' · aberta' : ''}</button>`).join('')}</div>
          <div class="cx-kpis">
            <div class="cx-kpi"><span>Lançado na central</span><b>${brl(S.totL)}</b><em class="muted">${S.L.length} lançamentos</em></div>
            <div class="cx-kpi"><span>Fatura do banco</span><b>${kpiFat}</b><em class="${difF === null ? 'muted' : v2(difF) ? 'ok' : 'alerta'}">${difF === null ? 'PDF ainda não importado' : v2(difF) ? 'bate com a central' : 'diferença de ' + brl(difF)}</em></div>
            <div class="cx-kpi"><span>No Conta Azul</span><b>${brl(S.totCA)}</b><em class="${v2(difC) ? 'ok' : 'muted'}">${v2(difC) ? 'tudo lançado' : 'faltam ' + brl(-difC)}</em></div>
          </div>
          ${formLancamento(c)}
        </div>
        <div class="cx-painel">
          <div class="cx-acoes">
            <button id="cxPdf">Importar PDF (fatura ou relatório do Meta)</button>
            ${prontas.length ? `<button id="cxSugeridos">Lançar ${prontas.length} da fatura com sugestão completa</button>` : ''}
            ${naoVieram.length ? `<button id="cxProxima">Passar ${naoVieram.length} que não vieram para a próxima fatura</button>` : ''}
            <button class="pri cx-dir" id="cxEnviar" ${enviaveis.length ? '' : 'disabled'}>Enviar ${enviaveis.length} conferidos ao Conta Azul</button>
          </div>
          <div class="msg" id="cxMsg"></div>
          ${tabelaLancamentos(S)}
          ${S.soFatura.length ? tabelaSoFatura(S) : ''}
          ${S.anulados.length ? `<details class="cx-det"><summary>Itens da fatura que se anulam (${S.anulados.length})</summary><table class="cx-t">${S.anulados.map(i => `<tr><td>${dia(i.data)}</td><td>${esc(i.desc)}</td><td class="v">${brl(i.valor)}</td></tr>`).join('')}</table></details>` : ''}
          ${S.caSobra.length ? `<details class="cx-det"><summary>No Conta Azul e não na central (${S.caSobra.length} · ${brl(r2(S.caSobra.reduce((s, x) => s + x.valor, 0)))})</summary><table class="cx-t">${S.caSobra.map(i => `<tr><td>${dia(i.comp)}</td><td>${esc(i.quem || '')}</td><td>${esc(i.desc || '')}</td><td class="muted">${esc(rotuloCentro(centroDoCA(i.partes)))}</td><td class="v">${brl(i.valor)}</td><td><span class="cx-lk" data-tz="${i.id}">trazer para a central</span></td></tr>`).join('')}</table></details>` : ''}
        </div>
      </section></div>`;
    ligarFaturas(S, prontas, enviaveis, naoVieram);
  }

  function opcoesCentro(sel) {
    const ps = C.base.projetos.filter(p => p.ativo || (sel && sel.indexOf('|' + p.nome + '|') >= 0));
    const o = (v, t) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(t)}</option>`;
    let h = `<option value="">— escolha —</option>` + o('M', 'Meraki');
    ps.forEach(p => { h += `<optgroup label="${esc(p.nome)}">` + o('P|' + p.nome + '|d', p.nome + ' · ' + p.parte + '/' + (100 - p.parte)) + o('P|' + p.nome + '|m', p.nome + ' · só Meraki') + o('P|' + p.nome + '|e', p.nome + ' · só expert') + '</optgroup>'; });
    const ult = sel && sel[0] === 'R' ? sel : (C.base.lancamentos.slice().reverse().find(l => (l.centro || '')[0] === 'R') || {}).centro;
    if (ult) h += o(ult, rotuloCentro(ult));
    h += `<option value="R?">Rateio entre projetos…</option>`;
    return h;
  }

  function formLancamento(c) {
    const l = editando || prefill || {};
    const cats = C.catalogo.categorias.length ? C.catalogo.categorias : Object.values(C.base.regras).map(r => r.categoria).filter((v, i, a) => v && a.indexOf(v) === i);
    return `<div class="cx-form" id="cxForm">
      <label>Data da compra<input type="date" id="fData" value="${esc(l.data || hoje())}"></label>
      <label>Fornecedor<input id="fForn" list="cxFornLista" value="${esc(l.fornecedor || '')}" autocomplete="off"></label>
      <label>Valor<input id="fValor" type="number" step="0.01" value="${l.valor != null ? l.valor : ''}"></label>
      <label>Projeto<select id="fCentro">${opcoesCentro(l.centro || '')}</select></label>
      <label>Categoria<select id="fCat"><option value=""></option>${cats.map(x => `<option ${x === l.categoria ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
      <label>Descrição<input id="fDesc" value="${esc(l.descricao || '')}"></label>
      <label>Parcela<input id="fParc" placeholder="ex.: 3/12" value="${esc(l.parcela || '')}"></label>
      <label class="cx-check"><span>Todo mês</span><input type="checkbox" id="fMes" ${l.assinatura && assinaturaAtiva(l.assinatura) ? 'checked' : ''}></label>
      <label>Fatura<select id="fVenc"></select></label>
      <div class="cx-botoes"><button class="pri" id="fSalvar">${editando ? 'Salvar' : 'Adicionar'}</button>${editando || prefill ? '<button id="fCancelar">Cancelar</button>' : ''}</div>
    </div>
    <datalist id="cxFornLista">${[...new Set(Object.keys(C.base.regras).concat(C.catalogo.fornecedores))].map(f => `<option value="${esc(f)}">`).join('')}</datalist>
    <div class="cx-dica" id="fDica"></div>`;
  }

  // filtro da tabela de lançamentos (continua valendo ao trocar de fatura ou de cartão)
  const filtro = {forn: '', proj: '', cat: '', texto: ''};
  const projetoDoCentro = c => { const [t, a] = String(c || 'M').split('|'); return t === 'M' ? 'Meraki' : t === 'R' ? 'Rateio' : a; };

  function tabelaLancamentos(S) {
    if (!S.L.length) return '<div id="cxTabela" class="cx-vazio">Nenhum lançamento nesta fatura.</div>';
    const forns = new Set(C.catalogo.fornecedores);
    const unicos = f => [...new Set(S.L.map(f).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt'));
    const opc = (lista, sel, vazio) => `<option value="">${vazio}</option>` + lista.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
    const t = semAc(filtro.texto);
    const L = S.L.filter(l => (!filtro.forn || l.fornecedor === filtro.forn) && (!filtro.proj || projetoDoCentro(l.centro) === filtro.proj)
      && (!filtro.cat || l.categoria === filtro.cat) && (!t || semAc(l.descricao + ' ' + l.fornecedor).includes(t)));
    const filtrando = filtro.forn || filtro.proj || filtro.cat || filtro.texto;
    return `<div id="cxTabela"><div class="cx-filtro">
      <select data-fl="forn">${opc(unicos(l => l.fornecedor), filtro.forn, 'Todos os fornecedores')}</select>
      <select data-fl="proj">${opc(unicos(l => projetoDoCentro(l.centro)), filtro.proj, 'Todos os projetos')}</select>
      <select data-fl="cat">${opc(unicos(l => l.categoria), filtro.cat, 'Todas as categorias')}</select>
      <input data-fl="texto" placeholder="Buscar na descrição" value="${esc(filtro.texto)}">
      ${filtrando ? '<span class="cx-lk" data-limpar="1">limpar filtro</span>' : ''}
    </div>
    <table class="cx-t"><thead><tr><th>Data</th><th>Fornecedor</th><th>Descrição</th><th>Projeto</th><th>Categoria</th><th class="c">Valor</th><th class="c">Fatura</th><th class="c">Conta Azul</th><th class="c">Ações</th></tr></thead><tbody id="cxLinhas">
      ${L.map(l => {
        const e = S.est[l.id];
        const stF = e.fatura ? `<span class="cx-st v" title="${esc(e.fatura.map(i => i.desc + ' ' + brl(i.valor)).join(' + '))}">confere${e.fatura.length > 1 ? ' (' + e.fatura.length + ' linhas)' : ''}</span>`
          : e.sugere ? `<span class="cx-st r" title="${esc(e.sugere.desc)}">fatura tem ${brl(e.sugere.valor)}</span>`
          : S.F.total != null ? '<span class="cx-st r">não está na fatura</span>' : '<span class="cx-st n">aguardando</span>';
        const stC = e.ca === 'enviado' ? '<span class="cx-st v">enviado</span>' : e.ca && e.ca.ajustar ? `<span class="cx-st r" title="${esc(e.ca.ajustar.desc)}">Conta Azul tem ${brl(e.ca.ajustar.valor)}</span>`
          : e.ca && e.ca.ajustarGrupo ? `<span class="cx-st r" title="${esc(e.ca.ajustarGrupo.desc + ' · no envio vira ' + brl(e.ca.soma))}">Conta Azul tem ${brl(e.ca.ajustarGrupo.valor)} no total</span>`
          : e.ca && e.ca.conflito ? `<span class="cx-st r" title="${esc(e.ca.conflito.map(x => x.desc + ' ' + brl(x.valor)).join(' + '))}">conferir no Conta Azul</span>` : e.ca ? `<span class="cx-st v" title="${esc(e.ca.map(x => x.desc + ' ' + brl(x.valor)).join(' + '))}">lançado</span>`
          : e.fatura && e.grupo && e.grupo.length > 1 ? `<span class="cx-st a" title="vai junto com as outras cobranças do mesmo projeto e mês">pronto · vai agrupado (${e.grupo.length})</span>`
          : e.fatura ? '<span class="cx-st a">pronto para enviar</span>' + (!forns.has(l.fornecedor) && C.catalogo.fornecedores.length ? ' <span class="cx-st n">fornecedor novo</span>' : '') : '<span class="cx-st n">—</span>';
        const trava = !!(l.caId);
        const extra = trava ? '' : e.sugere ? `<br><span class="cx-lk" data-uv="${l.id}">usar valor da fatura</span>` : (S.F.total != null && !e.fatura ? `<br><span class="cx-lk" data-px="${l.id}">próxima fatura</span>` : '');
        return `<tr><td>${dia(l.data)}</td><td>${esc(l.fornecedor)}</td><td>${esc(l.descricao)}${l.parcela && l.descricao.indexOf(l.parcela) < 0 ? ' <span class="muted">' + esc(l.parcela) + '</span>' : ''}${l.assinatura && assinaturaAtiva(l.assinatura) ? ' <span class="cx-st n">todo mês</span>' : ''}</td>
          <td>${esc(rotuloCentro(l.centro))}</td><td class="muted">${esc(l.categoria)}</td><td class="c ${l.valor < 0 ? 'neg' : ''}">${brl(l.valor)}</td><td class="c">${stF}</td><td class="c">${stC}</td>
          <td class="c">${trava ? '' : `<span class="cx-lk" data-ed="${l.id}">editar</span> · <span class="cx-lk neg" data-rm="${l.id}">excluir</span>`}${extra}</td></tr>`;
      }).join('')}
      <tr class="cx-total"><td colspan="5">${filtrando ? 'Total do filtro' : 'Total'} · ${L.length} ${L.length === 1 ? 'lançamento' : 'lançamentos'}</td><td class="c">${brl(r2(L.reduce((s, l) => s + l.valor, 0)))}</td><td colspan="3"></td></tr>
      </tbody></table></div>`;
  }

  function ligarTabela(S) {
    const caixa = el('cxTabela');
    if (!caixa) return;
    const redesenhar = () => { caixa.outerHTML = tabelaLancamentos(S); ligarTabela(S); };
    caixa.querySelectorAll('select[data-fl]').forEach(x => x.onchange = () => { filtro[x.dataset.fl] = x.value; redesenhar(); });
    const busca = caixa.querySelector('input[data-fl]');
    if (busca) busca.oninput = () => { filtro.texto = busca.value; clearTimeout(busca._t); busca._t = setTimeout(() => { redesenhar(); const b = el('cxTabela').querySelector('input[data-fl]'); b.focus(); b.setSelectionRange(b.value.length, b.value.length); }, 300); };
    const limpar = caixa.querySelector('[data-limpar]');
    if (limpar) limpar.onclick = () => { Object.keys(filtro).forEach(k => filtro[k] = ''); redesenhar(); };
    const linhas = el('cxLinhas');
    if (linhas) linhas.onclick = ev => {
      const ed = ev.target.closest('[data-ed]'), rm = ev.target.closest('[data-rm]'), uv = ev.target.closest('[data-uv]'), px = ev.target.closest('[data-px]');
      if (ed) { editando = C.base.lancamentos.find(l => l.id === ed.dataset.ed); prefill = null; desenharCartoes(); el('fValor').focus(); }
      if (uv) { const l = S.L.find(x => x.id === uv.dataset.uv), it = S.est[l.id].sugere; rodar('salvarLancamentos', [Object.assign({}, l, {valor: it.valor, data: it.data})]).then(carregarCartoes).catch(erro); }
      if (px) { const l = S.L.find(x => x.id === px.dataset.px); rodar('salvarLancamentos', [Object.assign({}, l, {venc: proximaFatura(l.venc)})]).then(carregarCartoes).catch(erro); }
      if (rm && confirm('Excluir este lançamento da central?')) rodar('excluirLancamentos', [rm.dataset.rm]).then(carregarCartoes).catch(erro);
    };
  }

  function tabelaSoFatura(S) {
    return `<h3 style="margin-top:18px">Na fatura e ainda não lançado (${S.soFatura.length})</h3>
      <table class="cx-t"><thead><tr><th>Data</th><th>Texto na fatura</th><th>Sugestão</th><th>Projeto</th><th class="c">Valor</th><th class="c">Ações</th></tr></thead><tbody id="cxSoFat">
      ${S.soFatura.map((s, i) => `<tr><td>${dia(s.data)}</td><td>${esc(s.item.desc)}${s.item.cartao ? ' <span class="muted">' + esc(String(s.item.cartao).slice(0, 14)) + '</span>' : ''}</td>
        <td>${s.fornecedor ? esc(s.fornecedor) + (s.categoria ? ' <span class="muted">· ' + esc(s.categoria) + '</span>' : '') : '<span class="muted">—</span>'}</td>
        <td>${s.centro ? esc(rotuloCentro(s.centro)) + (s.metaProj ? ' <span class="cx-st v">Meta</span>' : '') : '<span class="muted">—</span>'}</td>
        <td class="c ${s.valor < 0 ? 'neg' : ''}">${brl(s.valor)}</td><td class="c"><span class="cx-lk" data-pf="${i}">lançar…</span></td></tr>`).join('')}</tbody></table>`;
  }

  function ligarFaturas(S, prontas, enviaveis, naoVieram) {
    el('cxCorpo').querySelector('.cx-cartoes').onclick = ev => { const x = ev.target.closest('[data-c]'); if (x) { cartaoSel = x.dataset.c; vencSel = null; editando = prefill = null; desenharCartoes(); } };
    el('cxCorpo').querySelector('.cx-faturas').onclick = ev => { const x = ev.target.closest('[data-f]'); if (x) { vencSel = x.dataset.f; desenharCartoes(); } };
    ligarForm(S);
    ligarTabela(S);
    const sf = el('cxSoFat');
    if (sf) sf.onclick = ev => { const x = ev.target.closest('[data-pf]'); if (x) { prefill = S.soFatura[Number(x.dataset.pf)]; editando = null; desenharCartoes(); el('cxForm').scrollIntoView({block: 'center'}); } };
    el('cxPdf').onclick = () => el('cxArquivo').click();
    if (el('cxProxima')) el('cxProxima').onclick = () => {
      if (!confirm(`Passar ${naoVieram.length} lançamentos que não vieram nesta fatura para a fatura seguinte (${dia(proximaFatura(vencSel))})?`)) return;
      rodar('salvarLancamentos', naoVieram.map(l => Object.assign({}, l, {venc: proximaFatura(l.venc)}))).then(carregarCartoes).catch(erro);
    };
    if (el('cxSugeridos')) el('cxSugeridos').onclick = () => {
      const tot = r2(prontas.reduce((s, p) => s + p.valor, 0));
      if (!confirm(`Lançar na central ${prontas.length} itens da fatura (${brl(tot)}) com o fornecedor, categoria e projeto sugeridos?`)) return;
      rodar('salvarLancamentos', prontas.map(p => ({cartao: p.cartao, venc: p.venc, data: p.data, valor: p.valor, fornecedor: p.fornecedor, categoria: p.categoria,
        descricao: p.descricao, parcela: p.parcela, centro: p.centro, origem: 'fatura', padrao: p.chave}))).then(carregarCartoes).catch(erro);
    };
    el('cxEnviar').onclick = () => enviar(enviaveis);
    // lançamento feito direto no Conta Azul e que falta na central: entra já marcado como lançado (não é reenviado)
    el('cxCorpo').querySelectorAll('[data-tz]').forEach(a => a.onclick = () => {
      const x = S.caSobra.find(i => i.id === a.dataset.tz);
      if (!x || !confirm(`Trazer "${x.desc}" (${brl(x.valor)}) do Conta Azul para a central?`)) return;
      rodar('salvarLancamentos', [{cartao: cartaoSel, venc: vencSel, data: x.comp, valor: x.valor, fornecedor: x.quem || '', categoria: (x.partes[0] || [])[0] || '',
        descricao: x.desc || '', parcela: '', centro: centroDoCA(x.partes), origem: 'Conta Azul', caParcela: x.id}]).then(carregarCartoes).catch(erro);
    });
  }

  function ligarForm(S) {
    const f = id => el(id);
    const atualizarVenc = () => {
      const auto = vencDe(cartaoSel, f('fData').value);
      const base = editando ? editando.venc : prefill ? prefill.venc : (f('fParc').value && /^([2-9]|\d{2})\//.test(f('fParc').value) ? vencSel : auto);
      const opts = [...new Set([base, auto, vencSel].filter(Boolean))].sort();
      f('fVenc').innerHTML = opts.map(v => `<option value="${v}" ${v === base ? 'selected' : ''}>${dia(v)}</option>`).join('');
      const pm = !editando && /^(\d+)\/(\d+)$/.exec(f('fParc').value.trim());
      const extra = pm && Number(pm[1]) < Number(pm[2]) ? ' As parcelas ' + (Number(pm[1]) + 1) + '/' + pm[2] + ' a ' + pm[2] + '/' + pm[2] + ' entram sozinhas nas próximas faturas.' : '';
      f('fDica').textContent = ((base && base !== vencSel ? 'Vai para a fatura de ' + dia(base) + ' (' + cartao(cartaoSel).nome + ').' : '') + extra).trim();
    };
    const aplicarRegra = () => {
      const r = C.base.regras[f('fForn').value.trim()];
      if (!r || editando) return;
      if (r.categoria) f('fCat').value = r.categoria;
      if (r.descricao && !f('fDesc').value) f('fDesc').value = r.descricao;
      if (r.centro && !f('fCentro').value && f('fForn').value.trim() !== 'Facebook') f('fCentro').value = r.centro;
    };
    f('fData').onchange = atualizarVenc; f('fParc').oninput = atualizarVenc;
    f('fForn').onchange = aplicarRegra;
    f('fCentro').onchange = () => {
      if (f('fCentro').value !== 'R?') return;
      const ativos = C.base.projetos.filter(p => p.ativo).map(p => p.nome);
      const r = prompt('Projetos do rateio, separados por vírgula:\n' + ativos.join(', '), ativos.join(', '));
      const ns = (r || '').split(',').map(s => s.trim()).filter(n => projeto(n));
      if (!ns.length) { f('fCentro').value = ''; return; }
      const v = 'R|' + ns.join(',');
      const o = document.createElement('option'); o.value = v; o.textContent = rotuloCentro(v); f('fCentro').insertBefore(o, f('fCentro').lastChild); f('fCentro').value = v;
    };
    atualizarVenc();
    if (prefill && !prefill.fornecedor) f('fForn').focus();
    if (f('fCancelar')) f('fCancelar').onclick = () => { editando = prefill = null; desenharCartoes(); };
    f('fSalvar').onclick = () => {
      const l = {id: editando ? editando.id : undefined, cartao: cartaoSel, venc: f('fVenc').value, data: f('fData').value, valor: Number(f('fValor').value),
        fornecedor: f('fForn').value.trim(), categoria: f('fCat').value, descricao: f('fDesc').value.trim(), parcela: f('fParc').value.trim(),
        centro: f('fCentro').value, origem: editando ? editando.origem : prefill ? 'fatura' : 'central', padrao: prefill ? prefill.chave : undefined,
        todoMes: f('fMes').checked ? true : (editando && editando.assinatura ? false : undefined)};
      const falta = [!l.data && 'data', !l.valor && 'valor', !l.fornecedor && 'fornecedor', !l.centro && 'projeto', !l.categoria && 'categoria', !l.venc && 'fatura'].filter(Boolean);
      if (falta.length) { f('fDica').innerHTML = '<span class="alerta">Falta: ' + falta.join(', ') + '.</span>'; return; }
      if (l.todoMes && l.parcela) { f('fDica').innerHTML = '<span class="alerta">Compra parcelada já gera as próximas parcelas; desmarque "Todo mês".</span>'; return; }
      // mesmo fornecedor, mesmo valor, mesma data, mesmo cartão: provavelmente lançado duas vezes
      const dup = !editando && C.base.lancamentos.find(x => x.cartao === l.cartao && x.data === l.data && v2(x.valor - l.valor) && semAc(x.fornecedor) === semAc(l.fornecedor));
      if (dup && !confirm(`Já existe ${l.fornecedor} de ${brl(l.valor)} em ${dia(l.data)} neste cartão (${dup.descricao || 'sem descrição'} · ${rotuloCentro(dup.centro)}). Lançar de novo?`)) return;
      f('fSalvar').disabled = true;
      rodar('salvarLancamentos', [l]).then(() => {
        const manter = !editando && !prefill ? {data: l.data, fornecedor: l.fornecedor, categoria: l.categoria, descricao: l.descricao, centro: l.centro} : null;
        editando = null; prefill = null;
        return carregarCartoes().then(() => {
          if (manter) { // lançamento seguido do mesmo fornecedor (ex.: Facebook do dia): mantém tudo e limpa só o valor
            el('fData').value = manter.data; el('fForn').value = manter.fornecedor; el('fCat').value = manter.categoria; el('fDesc').value = manter.descricao; el('fCentro').value = manter.centro;
            el('fDica').textContent = 'Salvo ✓ ' + brl(l.valor) + ' · ' + l.fornecedor + ' · ' + rotuloCentro(l.centro) + (l.venc !== vencSel ? ' · fatura de ' + dia(l.venc) : '');
            el('fValor').focus();
          }
        });
      }).catch(e => { f('fSalvar').disabled = false; erro(e); });
    };
    f('fValor').onkeydown = ev => { if (ev.key === 'Enter') f('fSalvar').click(); };
  }

  function erro(e) { const m = el('cxMsg') || el('fDica'); if (m) m.innerHTML = '<span class="alerta">' + esc(e.message || e) + '</span>'; else alert(e.message || e); }

  function modal(html) {
    const m = document.createElement('div'); m.className = 'cx-modal'; m.innerHTML = '<div>' + html + '</div>';
    m.onclick = ev => { if (ev.target === m) m.remove(); };
    document.body.appendChild(m); return m;
  }

  // ---------- envio ao Conta Azul ----------
  function enviar(listaToda) {
    // o que já existe no Conta Azul com outro valor é corrigido lá; o resto é criado
    const S = situacao(cartaoSel, vencSel);
    const ajustes = [];
    listaToda.forEach(l => {
      const c = S.est[l.id].ca || {};
      if (c.ajustar) ajustes.push({ids: [l.id], x: c.ajustar, valor: l.valor, nome: c.ajustar.desc || l.fornecedor});
      // agrupado: só corrige quando todas as cobranças do grupo conferiram com a fatura
      else if (c.ajustarGrupo && !ajustes.some(a => a.x.id === c.ajustarGrupo.id) && c.ids.every(id => S.est[id].fatura))
        ajustes.push({ids: c.ids, x: c.ajustarGrupo, valor: c.soma, nome: (c.ajustarGrupo.desc || l.fornecedor) + ' (' + c.ids.length + ' cobranças)'});
    });
    const lista = listaToda.filter(l => { const c = S.est[l.id].ca || {}; return !c.ajustar && !c.ajustarGrupo; });
    // agrupados: um item com todas as cobranças (só quando todas conferiram com a fatura); separa se o projeto/divisão for diferente
    const vistos = new Set(), ids = [];
    lista.forEach(l => {
      const g = S.est[l.id].grupo;
      if (!g || g.length < 2) { ids.push(l.id); return; }
      if (vistos.has(l.id)) return;
      const membros = g.map(id => S.L.find(x => x.id === id));
      membros.forEach(m => vistos.add(m.id));
      if (!membros.every(m => S.est[m.id].fatura)) return;
      const porCentro = {};
      membros.forEach(m => (porCentro[m.centro] = porCentro[m.centro] || []).push(m.id));
      Object.values(porCentro).forEach(x => ids.push(x.length > 1 ? x : x[0]));
    });
    const qtdLanc = ids.length;
    el('cxMsg').textContent = 'Conferindo…';
    rodar('conferirEnvio', ids).then(res => {
      el('cxMsg').textContent = '';
      const ok = res.filter(r => r.ok), ruins = res.filter(r => !r.ok);
      const okIds = new Set(); ok.forEach(r => (r.ids || [r.id]).forEach(i => okIds.add(i)));
      const tot = r2(lista.filter(l => okIds.has(l.id)).reduce((s, l) => s + l.valor, 0));
      const agrupados = ok.filter(r => r.ids && r.ids.length > 1);
      const m = modal(`<h3>Enviar ao Conta Azul</h3>
        ${ok.length ? `<p>${ok.length} lançamentos novos, total ${brl(tot)}, como contas a pagar no ${esc(cartao(cartaoSel).nome)} com vencimento em ${dia(vencSel)}.</p>` : ''}
        ${agrupados.length ? `<p>Agrupados por projeto:</p><table class="cx-t">${agrupados.map(r => `<tr><td>${esc(r.descricao)}</td><td class="muted">${r.ids.length} cobranças</td><td class="v"><b>${brl(r.valor)}</b></td></tr>`).join('')}</table>` : ''}
        ${ajustes.length ? `<p>${ajustes.length} valores corrigidos no Conta Azul:</p><table class="cx-t">${ajustes.map(a => `<tr><td>${esc(a.nome)}</td><td class="v muted">${brl(a.x.valor)}</td><td>→</td><td class="v"><b>${brl(a.valor)}</b></td></tr>`).join('')}</table>` : ''}
        ${(() => { const novos = [...new Set(ok.map(r => r.fornecedorNovo).filter(Boolean))]; return novos.length ? `<p>Fornecedores que serão cadastrados no Conta Azul: <b>${novos.map(esc).join(', ')}</b></p>` : ''; })()}
        ${ruins.length ? `<p class="alerta">${ruins.length} não podem ir ainda:</p><table class="cx-t">${ruins.map(r => { const l = lista.find(x => x.id === r.id) || {}; return `<tr><td>${dia(l.data)}</td><td>${esc(l.fornecedor || '')}</td><td class="v">${brl(l.valor || 0)}</td><td class="alerta">${esc(r.erro)}</td></tr>`; }).join('')}</table>` : ''}
        <div class="acoes" style="margin-top:14px"><button class="pri" id="mOk" ${ok.length + ajustes.length ? '' : 'disabled'}>Enviar</button><button id="mNao">Cancelar</button></div><div class="msg" id="mMsg"></div>`);
      m.querySelector('#mNao').onclick = () => m.remove();
      m.querySelector('#mOk').onclick = async () => {
        m.querySelector('#mOk').disabled = true;
        const todos = ok.map(r => r.ids || r.id), feitos = [], falhas = [];
        for (let i = 0; i < todos.length; i += 20) {
          m.querySelector('#mMsg').textContent = `Enviando ${Math.min(i + 20, todos.length)} de ${todos.length}…`;
          try { const r = await rodar('enviarAoContaAzul', todos.slice(i, i + 20)); r.forEach(x => (x.ok ? feitos : falhas).push(x)); }
          catch (e) { falhas.push({erro: e.message || String(e)}); break; }
        }
        if (ajustes.length) {
          m.querySelector('#mMsg').textContent = 'Corrigindo valores no Conta Azul…';
          try { const r = await rodar('ajustarNoContaAzul', ajustes.map(a => ({ids: a.ids, parcela: a.x.id, valor: a.valor}))); r.forEach(x => (x.ok ? feitos : falhas).push(x)); }
          catch (e) { falhas.push({erro: e.message || String(e)}); }
        }
        m.querySelector('#mMsg').innerHTML = `<span class="ok">${feitos.length} concluídos.</span>` + (falhas.length ? `<br><span class="alerta">${falhas.length} com erro: ${esc(falhas.map(f => f.erro).filter((v, i, a) => a.indexOf(v) === i).join(' | '))}</span>` : '');
        m.querySelector('#mNao').textContent = 'Fechar';
        carregarCartoes();
      };
    }).catch(erro);
  }

  // ---------- importar PDFs (fatura do banco ou relatório do Meta) ----------
  el('cxArquivo').onchange = async ev => {
    const arquivos = [...ev.target.files]; ev.target.value = '';
    for (const a of arquivos) {
      try {
        const lib = await carregarPdfJs();
        const linhas = await linhasDoPdf(lib, new Uint8Array(await a.arrayBuffer()));
        const f = lerFatura(linhas);
        if (f) { await confirmarFatura(f, a.name); continue; }
        const r = lerRelatorioMeta(linhas);
        if (r) { await confirmarMeta(r, a.name); continue; }
        alert(a.name + ': não reconheci este PDF (aceito faturas do Itaú/Azul e relatórios de cobrança do Meta).');
      } catch (e) { alert(a.name + ': ' + (e.message || e)); }
    }
  };

  function confirmarFatura(f, nome) {
    return new Promise(ok => {
      const achado = C.base.cartoes.find(c => (c.finais || []).includes(f.final)) || cartao(cartaoSel);
      const bate = v2(f.soma - f.total);
      const m = modal(`<h3>Fatura ${esc(f.tipo)} · final ${esc(f.final || '?')}</h3>
        <div class="campos"><label>Cartão<select id="mCartao">${C.base.cartoes.map(c => `<option value="${c.id}" ${c.id === achado.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></label>
        <label>Vencimento<input id="mVenc" type="date" value="${f.venc || ''}"></label></div>
        <p>${f.itens.length} linhas somando ${brl(f.soma)} · total impresso ${brl(f.total)} · <b class="${bate ? 'ok' : 'alerta'}">${bate ? 'confere' : 'não confere'}</b></p>
        ${C.base.faturas[achado.id + '|' + f.venc] ? '<p class="muted">Já existe uma fatura importada para este vencimento; ela será substituída.</p>' : ''}
        <div class="acoes"><button class="pri" id="mOk">Importar</button><button id="mNao">Cancelar</button></div>`);
      m.querySelector('#mNao').onclick = () => { m.remove(); ok(); };
      m.querySelector('#mOk').onclick = () => {
        const cid = m.querySelector('#mCartao').value, venc = m.querySelector('#mVenc').value;
        m.querySelector('#mOk').disabled = true;
        rodar('salvarFatura', {cartao: cid, venc, total: f.total, tipo: f.tipo, final: f.final, itens: f.itens, arquivo: nome, limite: f.limite || null})
          .then(() => { m.remove(); cartaoSel = cid; vencSel = venc; return carregarCartoes(); }).then(ok).catch(e => { alert(e.message || e); ok(); });
      };
    });
  }

  function confirmarMeta(r, nome) {
    return new Promise(ok => {
      const p = C.base.projetos.find(p => (p.meta || []).includes(r.negocio));
      const m = modal(`<h3>Relatório do Meta · ${esc(r.negocio)}</h3>
        <p>${r.cobrancas.length} cobranças de ${esc(r.periodo)} somando ${brl(r.soma)}.</p>
        <div class="campos"><label>Projeto deste negócio<select id="mProj"><option value="">—</option>${C.base.projetos.filter(x => x.ativo).map(x => `<option ${p && p.nome === x.nome ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></label></div>
        <div class="acoes" style="margin-top:12px"><button class="pri" id="mOk">Importar</button><button id="mNao">Cancelar</button></div>`);
      m.querySelector('#mNao').onclick = () => { m.remove(); ok(); };
      m.querySelector('#mOk').onclick = () => {
        const proj = m.querySelector('#mProj').value;
        if (!proj) { alert('Escolha o projeto.'); return; }
        rodar('salvarRelatorioMeta', Object.assign({}, r, {projeto: proj, arquivo: nome})).then(() => { m.remove(); return carregarCartoes(); }).then(ok).catch(e => { alert(e.message || e); ok(); });
      };
    });
  }

  // ---------- gastos por projeto ----------
  let mesProj = null;
  function telaProjetos() {
    const meses = [...new Set(C.base.lancamentos.map(l => l.venc.slice(0, 7)))].sort().reverse();
    if (!mesProj || !meses.includes(mesProj)) mesProj = meses.find(m => m <= hoje().slice(0, 7)) || meses[0];
    const L = C.base.lancamentos.filter(l => l.venc.slice(0, 7) === mesProj);
    const linhas = {}, cards = C.base.cartoes.filter(c => L.some(l => l.cartao === c.id));
    L.forEach(l => dividir(l.centro, l.valor).forEach(([p, lado, v]) => {
      const x = linhas[p] = linhas[p] || {total: 0, meraki: 0, expert: 0, porCartao: {}};
      x.total += v; x[lado] += v; x.porCartao[l.cartao] = (x.porCartao[l.cartao] || 0) + v;
    }));
    const ordem = Object.keys(linhas).sort((a, b) => linhas[b].total - linhas[a].total);
    const max = Math.max(1, ...ordem.map(p => linhas[p].total)), tot = r2(L.reduce((s, l) => s + l.valor, 0));
    el('cxCorpo').innerHTML = `<div class="cx-painel">
      <div class="cx-faturas">${meses.map(m => `<button data-m="${m}" class="${m === mesProj ? 'on' : ''}">faturas de ${mesAno(m + '-01')}</button>`).join('')}</div>
      <div class="cx-kpis"><div class="cx-kpi"><span>Total nos cartões</span><b>${brl(tot)}</b></div>
        <div class="cx-kpi"><span>Parte Meraki</span><b>${brl(r2(ordem.reduce((s, p) => s + linhas[p].meraki, 0)))}</b></div>
        <div class="cx-kpi"><span>Parte dos experts</span><b>${brl(r2(ordem.reduce((s, p) => s + linhas[p].expert, 0)))}</b></div></div>
      <table class="cx-t"><thead><tr><th>Projeto</th><th></th><th class="v">Total</th><th class="v">Parte Meraki</th><th class="v">Parte do expert</th>${cards.map(c => `<th class="v">${esc(c.nome)}</th>`).join('')}</tr></thead><tbody>
      ${ordem.map(p => { const x = linhas[p]; return `<tr><td><b>${esc(p)}</b></td><td style="width:22%"><span class="cx-barra" title="Parte Meraki: ${brl(r2(x.meraki))}" style="width:${(x.meraki / max * 100).toFixed(1)}%"></span><span class="cx-barra e" title="Parte ${esc(p)}: ${brl(r2(x.expert))}" style="width:${(x.expert / max * 100).toFixed(1)}%"></span></td>
        <td class="v"><b>${brl(r2(x.total))}</b></td><td class="v">${brl(r2(x.meraki))}</td><td class="v">${brl(r2(x.expert))}</td>${cards.map(c => `<td class="v">${x.porCartao[c.id] ? brl(r2(x.porCartao[c.id])) : '<span class="muted">—</span>'}</td>`).join('')}</tr>`; }).join('')}
      <tr class="grupo"><td>Total</td><td></td><td class="v">${brl(tot)}</td><td></td><td></td>${cards.map(c => `<td class="v">${brl(r2(L.filter(l => l.cartao === c.id).reduce((s, l) => s + l.valor, 0)))}</td>`).join('')}</tr>
      </tbody></table></div>`;
    el('cxCorpo').querySelector('.cx-faturas').onclick = ev => { const x = ev.target.closest('[data-m]'); if (x) { mesProj = x.dataset.m; telaProjetos(); } };
  }

  // ---------- configurar ----------
  function telaConfig() {
    const B = C.base, contas = C.catalogo.contasCartao, centros = C.catalogo.centros;
    const selCentro = (v, cls) => `<select class="${cls}"><option value=""></option>${[...new Set(centros.concat(v ? [v] : []))].map(c => `<option ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`;
    const linhaCartao = c => `<tr><td><input class="kNome" value="${esc(c.nome)}"></td><td><input class="kFin" value="${esc((c.finais || []).join(', '))}"></td>
      <td><input class="kFech" type="number" min="1" max="31" value="${c.fech || ''}"></td><td><input class="kVenc" type="number" min="1" max="31" value="${c.venc || ''}"></td>
      <td><input class="kLim" type="number" step="0.01" value="${c.limite || ''}"></td>
      <td><select class="kConta"><option value="">— nenhuma —</option>${contas.map(x => `<option value="${x.id}" ${x.id === c.conta ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></td>
      <td><input type="checkbox" class="kAtivo" ${c.ativo ? 'checked' : ''}></td><td class="muted kId">${esc(c.id)}</td></tr>`;
    const linhaProj = p => `<tr><td><input class="pNome" value="${esc(p.nome)}"></td><td>${selCentro(p.meraki, 'pMer')}</td><td>${selCentro(p.expert, 'pExp')}</td>
      <td><input class="pParte" type="number" min="0" max="100" value="${p.parte}"></td><td><input class="pMeta" value="${esc((p.meta || []).join('; '))}"></td><td><input type="checkbox" class="pAtivo" ${p.ativo ? 'checked' : ''}></td></tr>`;
    const regras = Object.keys(B.regras).sort((a, b) => a.localeCompare(b, 'pt'));
    el('cxCorpo').innerHTML = `<div class="cx-painel cx-cfg"><h3>Cartões</h3>
        <table class="cx-t"><thead><tr><th>Nome</th><th>Finais (separados por vírgula)</th><th>Fecha dia</th><th>Vence dia</th><th>Limite</th><th>Conta no Conta Azul</th><th>Ativo</th><th></th></tr></thead><tbody id="kCartoes">${B.cartoes.map(linhaCartao).join('')}</tbody></table>
        <div class="acoes" style="margin-top:8px"><button id="kAdd">Adicionar cartão</button></div></div>
      <div class="cx-painel cx-cfg"><h3>Projetos</h3>
        <table class="cx-t"><thead><tr><th>Nome</th><th>Centro lado Meraki</th><th>Centro lado expert</th><th>% Meraki</th><th>Negócios no Meta</th><th>Ativo</th></tr></thead><tbody id="kProjs">${B.projetos.map(linhaProj).join('')}</tbody></table>
        <div class="acoes" style="margin-top:8px"><button id="pAdd">Adicionar projeto</button></div></div>
      <div class="cx-painel cx-cfg"><h3>Lançados todo mês (${(B.assinaturas || []).filter(a => a.ativo).length})</h3>
        <table class="cx-t"><thead><tr><th>Fornecedor</th><th>Cartão</th><th>Descrição</th><th>Projeto</th><th>Dia da compra</th><th>Valor</th><th>Por mês</th><th>Ativo</th></tr></thead><tbody id="kAss">
        ${(B.assinaturas || []).map(a => `<tr data-a="${a.id}"><td>${esc(a.fornecedor)}</td><td class="muted">${esc(cartao(a.cartao).nome || a.cartao)}</td><td class="muted">${esc(a.descricao)}</td><td class="muted">${esc(rotuloCentro(a.centro))}</td>
          <td><input class="aDia" type="number" min="1" max="31" value="${a.dia}"></td><td><input class="aVal" type="number" step="0.01" value="${a.valor}"></td>
          <td><input class="aQtd" type="number" min="1" max="10" value="${a.qtd || 1}"></td><td><input type="checkbox" class="aAtivo" ${a.ativo ? 'checked' : ''}></td></tr>`).join('')}
        </tbody></table></div>
      <div class="cx-painel cx-cfg"><h3>Fornecedores conhecidos (${regras.length})</h3>
        <table class="cx-t"><thead><tr><th>Fornecedor</th><th>Categoria</th><th>Descrição</th><th>Projeto padrão</th><th class="c">Agrupar no envio</th><th></th></tr></thead><tbody id="kRegras">
        ${regras.map(f => { const r = B.regras[f]; return `<tr data-f="${esc(f)}"><td>${esc(f)}${C.catalogo.fornecedores.length && !C.catalogo.fornecedores.includes(f) ? ' <span class="cx-st n">novo</span>' : ''}</td><td class="muted">${esc(r.categoria || '')}</td><td class="muted">${esc(r.descricao || '')}</td><td class="muted">${r.centro ? esc(rotuloCentro(r.centro)) : ''}</td><td class="c"><input type="checkbox" class="rAgr" ${agrupa(f) ? 'checked' : ''}></td><td><span class="cx-lk neg" data-rmr="${esc(f)}">esquecer</span></td></tr>`; }).join('')}
        </tbody></table></div>
      <div class="acoes"><button class="pri" id="kSalvar">Salvar configurações</button><span class="msg" id="kMsg"></span></div>`;
    const regrasNovas = Object.assign({}, B.regras);
    el('kRegras').onclick = ev => { const x = ev.target.closest('[data-rmr]'); if (x) { delete regrasNovas[x.dataset.rmr]; x.closest('tr').remove(); } };
    el('kAdd').onclick = () => el('kCartoes').insertAdjacentHTML('beforeend', linhaCartao({nome: '', finais: [], fech: '', venc: '', conta: '', ativo: true, id: ''}));
    el('pAdd').onclick = () => el('kProjs').insertAdjacentHTML('beforeend', linhaProj({nome: '', meraki: '', expert: '', parte: 50, meta: [], ativo: true}));
    el('kSalvar').onclick = () => {
      const cartoes = [...el('kCartoes').rows].map(tr => {
        const q = s => tr.querySelector(s), nome = q('.kNome').value.trim();
        const finais = q('.kFin').value.split(/[,;\s]+/).filter(x => /^\d{4}$/.test(x));
        return {id: q('.kId').textContent || 'c' + (finais[0] || semAc(nome).replace(/\W/g, '')), nome, finais, fech: Number(q('.kFech').value), venc: Number(q('.kVenc').value),
          limite: Number(q('.kLim').value) || null, conta: q('.kConta').value || null, ativo: q('.kAtivo').checked};
      }).filter(c => c.nome);
      const projetos = [...el('kProjs').rows].map(tr => {
        const q = s => tr.querySelector(s);
        return {nome: q('.pNome').value.trim(), meraki: q('.pMer').value, expert: q('.pExp').value, parte: Number(q('.pParte').value),
          meta: q('.pMeta').value.split(';').map(s => s.trim()).filter(Boolean), ativo: q('.pAtivo').checked};
      }).filter(p => p.nome);
      if (cartoes.some(c => !c.fech || !c.venc)) { el('kMsg').innerHTML = '<span class="alerta">Preencha o dia de fechamento e de vencimento de todos os cartões.</span>'; return; }
      if (projetos.some(p => !p.meraki || !p.expert)) { el('kMsg').innerHTML = '<span class="alerta">Escolha os dois centros de custo de cada projeto.</span>'; return; }
      el('kRegras').querySelectorAll('tr[data-f]').forEach(tr => { const f = tr.dataset.f; if (regrasNovas[f]) regrasNovas[f] = Object.assign({}, regrasNovas[f], {agrupar: tr.querySelector('.rAgr').checked}); });
      const assinaturas = (B.assinaturas || []).map(a => { const tr = el('kAss').querySelector(`[data-a="${a.id}"]`), q = s => tr.querySelector(s);
        return Object.assign({}, a, {dia: Number(q('.aDia').value) || a.dia, valor: Number(q('.aVal').value) || a.valor, qtd: Number(q('.aQtd').value) || 1, ativo: q('.aAtivo').checked}); });
      rodar('salvarConfigCartoes', {cartoes, projetos, regras: regrasNovas, assinaturas}).then(() => { el('kMsg').innerHTML = '<span class="ok">Salvo ✓</span>'; return carregarCartoes(); }).catch(e => el('kMsg').innerHTML = '<span class="alerta">' + esc(e.message || e) + '</span>');
    };
  }

  el('cxSub').onclick = ev => { const b = ev.target.closest('[data-v]'); if (b) { vista = b.dataset.v; editando = prefill = null; desenharCartoes(); } };
  if (typeof abrirAba === 'function') abrirAba('cartoes');
})();
</script>

</body>
</html>
